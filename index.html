<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geogram - Secure Messenger</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0e1621; color: #f5f5f5; font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4Mr6c0uFkN7JRuK_xu_wOtM1INBB82SM",
      authDomain: "geogram-4c75b.firebaseapp.com",
      projectId: "geogram-4c75b",
      storageBucket: "geogram-4c75b.firebasestorage.app",
      messagingSenderId: "1043376472946",
      appId: "1:1043376472946:web:30c0fa00e8446ddb9f93eb",
      measurementId: "G-K9LR7YWXY3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.firebaseModules = { collection, addDoc, query, orderBy, onSnapshot, serverTimestamp };
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <script type="text/babel">
    function GeogramApp() {
      const [chats, setChats] = React.useState([
        { id: "chat_bot", name: "Geogram Official Bot", lastMsg: "স্বাগতম Geogram-এ! হাই সিকিউরিটি সক্রিয়।", time: "09:00 AM", unread: 0, online: true, avatar: "GG" },
        { id: "chat_friends", name: "Friends Testing Group", lastMsg: "দোস্তরা কে কোথায় আছিস?", time: "08:30 AM", unread: 0, online: true, avatar: "FG" }
      ]);

      const [activeChat, setActiveChat] = React.useState(chats[0]);
      const [messages, setMessages] = React.useState([]);
      const [inputText, setInputText] = React.useState("");
      const [mobileShowChat, setMobileShowChat] = React.useState(false);
      const [isFirebaseConnected, setIsFirebaseConnected] = React.useState(false);

      // Listen to Firebase Realtime Messages for Active Chat
      React.useEffect(() => {
        const checkFirebase = () => {
          if (window.db && window.firebaseModules) {
            setIsFirebaseConnected(true);
            const { collection, query, orderBy, onSnapshot } = window.firebaseModules;
            const q = query(collection(window.db, "chats", activeChat.id, "messages"), orderBy("createdAt", "asc"));
            
            const unsubscribe = onSnapshot(q, (snapshot) => {
              const msgs = [];
              snapshot.forEach((doc) => {
                msgs.push({ id: doc.id, ...doc.data() });
              });
              setMessages(msgs);
            });

            return () => unsubscribe();
          }
        };

        window.addEventListener('firebase-ready', checkFirebase);
        const timer = setTimeout(checkFirebase, 1000);
        return () => clearTimeout(timer);
      }, [activeChat]);

      const sendMessage = async (e) => {
        e.preventDefault();
        if (!inputText.trim()) return;

        const textToSend = inputText;
        setInputText("");

        if (window.db && window.firebaseModules) {
          const { collection, addDoc, serverTimestamp } = window.firebaseModules;
          try {
            await addDoc(collection(window.db, "chats", activeChat.id, "messages"), {
              text: textToSend,
              sender: "user",
              createdAt: serverTimestamp(),
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            // If chatting with Bot, send auto response
            if (activeChat.id === "chat_bot") {
              setTimeout(async () => {
                await addDoc(collection(window.db, "chats", activeChat.id, "messages"), {
                  text: `Geogram Bot (Secure E2EE): আপনার মেসেজটি সুরক্ষিতভাবে প্রসেস হয়েছে। 👍`,
                  sender: "bot",
                  createdAt: serverTimestamp(),
                  time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
              }, 1000);
            }
          } catch (error) {
            console.error("Error sending message: ", error);
          }
        }
      };

      return (
        <div className="flex h-[100dvh] w-full bg-[#0e1621] overflow-hidden">
          
          {/* Left Sidebar: Chat List */}
          <div className={`${mobileShowChat ? 'hidden md:flex' : 'flex'} w-full md:w-[380px] flex-col bg-[#17212b] border-r border-[#242f3d] shrink-0`}>
            
            {/* Sidebar Header */}
            <div className="px-4 py-3 flex items-center justify-between border-b border-[#242f3d]">
              <div className="flex items-center gap-3">
                <button className="text-[#8796a5] hover:text-white text-lg"><i className="fa-solid fa-bars"></i></button>
                <h1 className="font-bold text-white text-[17px]">Geogram</h1>
              </div>
              <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${isFirebaseConnected ? 'bg-green-500/20 text-[#78e378]' : 'bg-yellow-500/20 text-yellow-400'}`}>
                {isFirebaseConnected ? '● Live DB' : 'Connecting...'}
              </span>
            </div>

            {/* Chat List Items */}
            <div className="flex-1 overflow-y-auto divide-y divide-[#242f3d]/30">
              {chats.map(chat => (
                <div 
                  key={chat.id} 
                  onClick={() => { setActiveChat(chat); setMobileShowChat(true); }}
                  className={`flex items-center gap-3 px-3 py-3 cursor-pointer transition-colors ${activeChat.id === chat.id ? 'bg-[#2b5278]/40' : 'hover:bg-[#202e3a]'}`}
                >
                  <div className="relative">
                    <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-700 flex items-center justify-center font-bold text-white text-lg shadow-sm">
                      {chat.avatar}
                    </div>
                    {chat.online && <div className="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 rounded-full border-2 border-[#17212b]"></div>}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex justify-between items-baseline mb-1">
                      <h2 className="font-semibold text-[15px] text-white truncate">{chat.name}</h2>
                      <span className="text-[11px] text-[#8796a5]">{chat.time}</span>
                    </div>
                    <p className="text-[13px] text-[#8796a5] truncate">{chat.lastMsg}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Right Main Chat Area */}
          <div className={`${!mobileShowChat ? 'hidden md:flex' : 'flex'} flex-1 flex-col bg-[#0e1621] h-full relative`}>
            
            {/* Chat Header */}
            <div className="bg-[#17212b] px-4 py-3 flex items-center justify-between border-b border-[#242f3d] z-10">
              <div className="flex items-center gap-3">
                <button onClick={() => setMobileShowChat(false)} className="md:hidden text-[#8796a5] hover:text-white mr-1 text-lg">
                  <i className="fa-solid fa-arrow-left"></i>
                </button>
                <div className="relative">
                  <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center font-bold text-white text-md shadow-md">
                    {activeChat.avatar}
                  </div>
                  <div className="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-[#17212b]"></div>
                </div>
                <div>
                  <h1 className="font-bold text-[15px] text-white tracking-wide">{activeChat.name}</h1>
                  <p className="text-[12px] text-[#78e378] font-medium">online (High Security E2EE)</p>
                </div>
              </div>

              <div className="flex items-center gap-5 text-[#8796a5] text-lg">
                <button title="Audio Call" className="hover:text-white transition-colors"><i className="fa-solid fa-phone"></i></button>
                <button title="Video Call" className="hover:text-white transition-colors"><i className="fa-solid fa-video"></i></button>
                <button title="Anti-Spam Active" className="text-[#78e378] transition-colors"><i className="fa-solid fa-shield-halved"></i></button>
              </div>
            </div>

            {/* Messages Scroll Area */}
            <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-[#0e1621]">
              <div className="text-center my-2">
                <span className="bg-[#17212b] text-[#8796a5] text-[11px] px-3 py-1 rounded-full border border-[#242f3d]">
                  🔒 End-to-End Encrypted & Anti-Spam Protected
                </span>
              </div>

              {messages.map((msg, index) => (
                <div key={msg.id || index} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[75%] rounded-[12px] px-3 py-2 text-[14px] shadow-sm relative ${
                    msg.sender === 'user' 
                      ? 'bg-[#2b5278] text-white rounded-br-[4px]' 
                      : 'bg-[#182533] text-[#f5f5f5] rounded-bl-[4px] border border-[#242f3d]/30'
                  }`}>
                    <p className="leading-[18px] break-words">{msg.text}</p>
                    <div className="text-[10px] text-right mt-1 opacity-70 flex items-center justify-end gap-1">
                      <span>{msg.time || "Just now"}</span>
                      {msg.sender === 'user' && <i className="fa-solid fa-check-double text-[#5288c1]"></i>}
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Message Input Footer */}
            <form onSubmit={sendMessage} className="bg-[#17212b] px-3 py-2.5 flex items-center gap-2 border-t border-[#242f3d]">
              <button type="button" className="text-[#8796a5] hover:text-white p-2 text-xl transition-colors">
                <i className="fa-solid fa-paperclip"></i>
              </button>
              
              <input 
                type="text" 
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
                placeholder="Write a secure message..." 
                className="flex-1 bg-[#242f3d] text-white px-4 py-2 rounded-full text-[14px] outline-none placeholder-[#6d7f8f] focus:ring-1 focus:ring-[#5288c1]"
              />

              {inputText.trim() ? (
                <button type="submit" className="bg-[#5288c1] text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-[#366391] transition-colors shadow-md">
                  <i className="fa-solid fa-paper-plane text-sm"></i>
                </button>
              ) : (
                <button type="button" className="text-[#8796a5] hover:text-white p-2 text-xl transition-colors">
                  <i className="fa-solid fa-microphone"></i>
                </button>
              )}
            </form>

          </div>

        </div>
      );
    }

    ReactDOM.render(<GeogramApp />, document.getElementById('root'));
  </script>
</body>
</html>
